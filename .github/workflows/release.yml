name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # make-app.sh derives the version from git describe

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: Scripts/make-app.sh release

      # ------------------------------------------------------------------
      # Signing and notarization are commented out until an Apple Developer
      # Program membership exists. Without them the DMG still builds, but
      # macOS blocks it on first launch and users must right-click -> Open.
      # See docs/RELEASING.md for the secrets these need.
      # ------------------------------------------------------------------
      #
      # - name: Import Developer ID certificate
      #   env:
      #     CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      #     CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      #   run: |
      #     echo "$CERTIFICATE" | base64 --decode > certificate.p12
      #     security create-keychain -p actions build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p actions build.keychain
      #     security import certificate.p12 -k build.keychain \
      #       -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: \
      #       -s -k actions build.keychain
      #     rm certificate.p12
      #
      # - name: Sign
      #   env:
      #     TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     codesign --force --options runtime --timestamp \
      #       --sign "Developer ID Application: ($TEAM_ID)" \
      #       dist/FileFerry.app
      #
      # - name: Notarize and staple
      #   env:
      #     KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      #     ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      #     KEY: ${{ secrets.NOTARY_KEY }}
      #   run: |
      #     echo "$KEY" > notary.p8
      #     ditto -c -k --keepParent dist/FileFerry.app dist/FileFerry.zip
      #     xcrun notarytool submit dist/FileFerry.zip \
      #       --key notary.p8 --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
      #     xcrun stapler staple dist/FileFerry.app
      #     rm notary.p8

      - name: Build DMG
        run: Scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Build zip
        run: Scripts/make-zip.sh "${GITHUB_REF_NAME#v}"

      - name: Checksum
        run: shasum -a 256 dist/*.dmg dist/*.zip | tee dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## FileFerry ${{ github.ref_name }}

            Copy and move files between a Mac and an Android phone over USB.

            **Requirements**
            - macOS 14 or later
            - `brew install --cask android-platform-tools`
            - USB debugging enabled on the phone

            > This build is not notarized. On first launch, right-click
            > FileFerry in Applications and choose **Open**.
